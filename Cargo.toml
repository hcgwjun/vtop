[package]
name = "vtop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3"
crossterm = "0.29.0"
prost = "0.14"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
macmon = { version = "0.10.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
